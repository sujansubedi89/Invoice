{% extends 'base.html' %}
{% block title %}Edit User{% endblock %}
{% block page_title %}Edit: {{ target_user.username }}{% endblock %}

{% block topbar_actions %}
  <a href="{% url 'user_list' %}" class="btn btn-outline btn-sm">← Back</a>
{% endblock %}

{% block content %}
<div style="max-width:480px;">
  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="form-group" style="margin-bottom:16px;">
          <label>Role</label>
          <select name="role" class="form-input">
            {% for val, label in roles %}
            <option value="{{ val }}" {% if profile.role == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group" style="margin-bottom:20px;">
          <label>Department</label>
          <input type="text" name="department" class="form-input" value="{{ profile.department }}">
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
